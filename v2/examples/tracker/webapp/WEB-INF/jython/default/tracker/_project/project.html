<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>My projects</title></head>
<body>
  <h1>My projects</h1>
  <p><a href="{{ctxPath}}/t/tracker/project/edit">Create project</a></p>
  <form method="get" action="{{ctxPath}}/t/tracker/project" class="my-4 flex flex-wrap items-end gap-3">
    <label>Search by name <input name="q" value="{{q}}" maxlength="120"></label>
    <button type="submit">Search</button>
  </form>
  <div class="overflow-x-auto">
    <table>
      <thead><tr><th>Name</th><th>Actions</th></tr></thead>
      <tbody>
        {{#each projects}}
        <tr>
          <td><a href="{{../ctxPath}}/t/tracker/task?project_id={{id}}">{{name}}</a></td>
          <td><a href="{{../ctxPath}}/t/tracker/project/edit?id={{id}}">Edit project</a></td>
        </tr>
        {{else}}<tr><td colspan="2">No matching projects.</td></tr>{{/each}}
      </tbody>
    </table>
  </div>
  <nav class="my-4 flex gap-4" aria-label="Pagination">
    {{#if previous_url}}<a href="{{previous_url}}">Previous</a>{{/if}}
    <span>Page {{page}}</span>
    {{#if next_url}}<a href="{{next_url}}">Next</a>{{/if}}
  </nav>
</body>
</html>
