# Apply in the namespace of the SØAD IDE Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: soad-release-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: soad-release-controller
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: soad-release-controller
subjects:
  - kind: ServiceAccount
    name: soad-release-controller
roleRef:
  kind: Role
  name: soad-release-controller
  apiGroup: rbac.authorization.k8s.io
